<!DOCTYPE html>
<html lang="en">
<head>
    <title>三视图</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #aaaaaa;
        }
        /* 顶部标题 */
        #titleLabel {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            z-index: 999999;
            pointer-events: none;
            white-space: nowrap;
        }
        /* 加载动画遮罩 */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999999;
            gap: 16px;
        }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            color: #fff;
            font-size: 16px;
        }
        .loading-sub {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }
        /* 底部复位按钮 */
        #resetBtn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            z-index: 999999;
        }
        #resetBtn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        /* 移动端适配 */
        @media (max-width: 768px) {
            #titleLabel {
                font-size: 16px;
                padding: 6px 12px;
                top: 8px;
            }
            #resetBtn {
                padding: 8px 20px;
                font-size: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="titleLabel"></div>
    <!-- 加载动画 -->
    <div id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在从腾讯云加载模型...</div>
        <div class="loading-sub" id="loadingSub"></div>
    </div>
    <button id="resetBtn">复位</button>

    <script src="libs/cos-cache.js"></script>
    <script src="libs/three.js"></script>
    <script src="libs/inflate.min.js"></script>
    <script src="libs/FBXLoader.js"></script>
    <script src="libs/OrbitControls.js"></script>

    <script type="text/javascript">
        const params = new URLSearchParams(window.location.search);
        const currentTitle = params.get('title') || '例题1';
        const modelUrl = params.get('model') || '';
        document.getElementById('titleLabel').innerText = currentTitle;

        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingSub = document.getElementById('loadingSub');

        function setLoading(text) {
            if (text) loadingSub.textContent = text;
        }
        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }
        function showLoading() {
            loadingOverlay.style.display = 'flex';
        }

        var container, controls;
        var camera, scene, renderer;
        var objects = [];
        var group2 = new THREE.Group(), group3 = new THREE.Group();

        // 坐标轴模型保持本地加载
        var axisPath = "models/zyjibenti/zuobiaoxi3.fbx";

        init();
        animate();

        // 复位函数
        function reset() {
            let model = scene.getObjectByName("a12");
            if (model) {
                fitCameraToObject(camera, controls, model);
            }
        }
        document.getElementById('resetBtn').addEventListener('click', reset);

        function init() {
            container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.left = '0';
            container.style.top = '0';
            container.style.width = '100%';
            container.style.height = '100%';
            document.body.appendChild(container);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = false;
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize, false);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaaaaa);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            var light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
            light.position.set(0, 300, 0);
            scene.add(light);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(0, 200, 300);
            scene.add(dirLight);

            group2.position.set(83, -64, -64);
            group3.position.set(83, -64, -64);
            scene.add(group2, group3);

            loadmodel2(axisPath, "a11");
            loadMainModel(modelUrl, currentTitle);
        }

        function fitCameraToObject(camera, controls, object, offset = 1.8) {
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= offset;
            camera.position.set(center.x, center.y + cameraZ * 0.3, center.z + cameraZ);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 加载主模型：优先使用 COS URL（带 IndexedDB 缓存），否则回退本地文件
        async function loadMainModel(url, title) {
            let blobUrl = null;
            if (url) {
                try {
                    setLoading('正在从腾讯云下载模型...');
                    blobUrl = await getCOSBlob(url);
                    setLoading('模型下载完成，正在解析...');
                } catch (e) {
                    console.warn('云端模型加载失败，尝试本地加载:', e.message);
                    blobUrl = null;
                }
            }

            if (!blobUrl) {
                // 回退到本地文件
                setLoading('正在加载本地模型文件...');
                blobUrl = `models/${title}.fbx`;
            }

            loadFBXFromURL(blobUrl, "a12");
        }

        function loadFBXFromURL(blobUrl, str) {
            var loader = new THREE.FBXLoader();
            loader.load(blobUrl, function (object0) {
                object0.visible = true;
                object0.rotation.x = -Math.PI / 2;

                var box = new THREE.Box3().setFromObject(object0);
                var size = box.getSize(new THREE.Vector3());
                var maxDim = Math.max(size.x, size.y, size.z);
                var scale = 80 / maxDim;
                object0.scale.set(scale, scale, scale);

                var center = box.getCenter(new THREE.Vector3());
                object0.position.sub(center);
                object0.position.add(new THREE.Vector3(83, -64, -64));

                object0.traverse(child => { if (child.isMesh) child.visible = true; });

                if (str === "a12") {
                    objects = [];
                    object0.traverse(child => { if (child.isMesh) objects.push(child); });
                }

                object0.name = str;
                scene.add(object0);
                fitCameraToObject(camera, controls, object0);
                hideLoading();
            }, undefined, function (err) {
                console.error('FBX 模型解析失败:', err);
                hideLoading();
            });
        }

        function loadmodel2(patha, str) {
            var loader = new THREE.FBXLoader();
            loader.load(patha, function (object0) {
                object0.visible = true;
                object0.rotation.x = -Math.PI / 2;
                object0.traverse(child => { if (child.isMesh) child.visible = true; });
                object0.name = str;
                scene.add(object0);
            });
        }
    </script>
</body>
</html>
