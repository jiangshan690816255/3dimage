<!DOCTYPE html>
<html lang="en">
<head>
    <title>三视图</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="mycss/myhtml.css" />
    <style>
        #titleLabel {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 22px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 6px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <label class="a" id="test"> 3d </label>
    <label class="b" id="test2">黄先生</label>
    <div id="titleLabel"></div>

    <script src="libs/three.js"></script>
    <script src="libs/inflate.min.js"></script>
    <script src="libs/dat.gui.min.js"></script>
    <script src="libs/FBXLoader.js"></script>
    <script src="libs/OrbitControls.js"></script>

    <script type="text/javascript">
        const params = new URLSearchParams(window.location.search);
        const currentTitle = params.get('title') || '例题1';
        document.getElementById('titleLabel').innerText = currentTitle;
        // ==============================================
        // 🔥 直接拼接路径，无映射、无配置
        // ==============================================
        const currentFbx = `../models/${currentTitle}.fbx`;

        var sUserAgent = navigator.userAgent.toLowerCase();
        if (/ipad|iphone|midp|rv:1.2.3.4|ucweb|android|windows ce|mobile/.test(sUserAgent)) {
            document.write('<link type="text/css" rel="stylesheet" href="mycss/mobile_pic.css" />');
        } else {
            document.write('<link type="text/css" rel="stylesheet" href="mycss/pc_pic.css" />');
        }

        var container, controls;
        var camera, scene, renderer;
        var objects = [];
        var ToolCtrl;
        var group2 = new THREE.Group(), group3 = new THREE.Group();

        var path = [
            "../models/zyjibenti/zuobiaoxi3.fbx",
            currentFbx
        ];

        var text = [
            "三视图特性(展开之后):</br>",
            "(1)、三个视图的位置关系是：俯视图在主视图正下方，左视图在主视图正右方；</br>(2)、三个视图的尺寸关系是：长对正、宽相等、高平齐。",
        ];

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = false;
            container.appendChild(renderer.domElement);
            window.addEventListener('resize', onWindowResize, false);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaaaaa);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            controls = new THREE.OrbitControls(camera, renderer.domElement);

            // ==========================
            // 🔥 灯光恢复原版亮度 0.7
            // ==========================
            var light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
            light.position.set(0, 300, 0);
            scene.add(light);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(0, 200, 300);
            scene.add(dirLight);

            group2.position.set(83, -64, -64);
            group3.position.set(83, -64, -64);
            scene.add(group2, group3);

            loadmodel2(path[0], "a11");
            loadmodel2(path[1], "a12");

            ToolCtrl = new function () {
                this.flag2 = true;
                this.fxwReset = function () { reset(); };
                document.getElementById("test").innerHTML = text[0] + text[1];
            };

            var gui = new dat.GUI({ width: 220 });
            gui.add(ToolCtrl, 'flag2').name("模型显示").onChange(e => showmodel(e));
            gui.add(ToolCtrl, 'fxwReset').name("复位（居中）");
        }

        function reset() {
            ToolCtrl.flag2 = true;
            showmodel(true);

            let model = scene.getObjectByName("a12");
            if (model) {
                fitCameraToObject(camera, controls, model);
            }
        }

        function fitCameraToObject(camera, controls, object, offset = 1.8) {
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= offset;
            camera.position.set(center.x, center.y + cameraZ * 0.3, center.z + cameraZ);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function loadmodel2(patha, str) {
            var loader = new THREE.FBXLoader();
            loader.load(patha, function (object0) {
                object0.visible = true;
                object0.rotation.x = -Math.PI / 2;

                var box = new THREE.Box3().setFromObject(object0);
                var size = box.getSize(new THREE.Vector3());
                var maxDim = Math.max(size.x, size.y, size.z);
                var scale = 80 / maxDim;
                object0.scale.set(scale, scale, scale);

                var center = box.getCenter(new THREE.Vector3());
                object0.position.sub(center);
                object0.position.add(new THREE.Vector3(83, -64, -64));

                object0.traverse(child => {
                    if (child.isMesh) child.visible = true;
                });

                if (str === "a12") {
                    objects = [];
                    object0.traverse(child => {
                        if (child.isMesh) objects.push(child);
                    });
                }

                object0.name = str;
                scene.add(object0);
                fitCameraToObject(camera, controls, object0);
            });
        }

        function showmodel(flag) {
            let model = scene.getObjectByName("a12");
            if (model) model.visible = flag;
            objects.forEach(obj => {
                if (obj) obj.visible = flag;
            });
        }

    </script>
</body>
</html>
