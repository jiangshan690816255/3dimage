<!DOCTYPE html>
<html lang="en">
<head>
    <title>三视图</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #aaaaaa;
        }
        /* 顶部标题 */
        #titleLabel {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            z-index: 999999;
            pointer-events: none;
            white-space: nowrap;
        }
        /* 底部复位按钮 */
        #resetBtn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            z-index: 999999;
        }
        #resetBtn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        /* 移动端适配 */
        @media (max-width: 768px) {
            #titleLabel {
                font-size: 16px;
                padding: 6px 12px;
                top: 8px;
            }
            #resetBtn {
                padding: 8px 20px;
                font-size: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="titleLabel"></div>
    <button id="resetBtn">复位</button>

    <script src="libs/three.js"></script>
    <script src="libs/inflate.min.js"></script>
    <script src="libs/FBXLoader.js"></script>
    <script src="libs/OrbitControls.js"></script>

    <script type="text/javascript">
        const params = new URLSearchParams(window.location.search);
        const currentTitle = params.get('title') || '例题1';
        document.getElementById('titleLabel').innerText = currentTitle;

        const currentFbx = `models/${currentTitle}.fbx`;

        var container, controls;
        var camera, scene, renderer;
        var objects = [];
        var group2 = new THREE.Group(), group3 = new THREE.Group();

        var path = [
            "../models/zyjibenti/zuobiaoxi3.fbx",
            currentFbx
        ];

        init();
        animate();

        // 复位函数
        function reset() {
            let model = scene.getObjectByName("a12");
            if (model) {
                fitCameraToObject(camera, controls, model);
            }
        }
        // 绑定按钮点击事件
        document.getElementById('resetBtn').addEventListener('click', reset);

        function init() {
            container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.left = '0';
            container.style.top = '0';
            container.style.width = '100%';
            container.style.height = '100%';
            document.body.appendChild(container);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = false;
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize, false);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaaaaa);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            var light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
            light.position.set(0, 300, 0);
            scene.add(light);

            var dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(0, 200, 300);
            scene.add(dirLight);

            group2.position.set(83, -64, -64);
            group3.position.set(83, -64, -64);
            scene.add(group2, group3);

            loadmodel2(path[0], "a11");
            loadmodel2(path[1], "a12");
        }

        function fitCameraToObject(camera, controls, object, offset = 1.8) {
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= offset;
            camera.position.set(center.x, center.y + cameraZ * 0.3, center.z + cameraZ);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function loadmodel2(patha, str) {
            var loader = new THREE.FBXLoader();
            loader.load(patha, function (object0) {
                object0.visible = true;
                object0.rotation.x = -Math.PI / 2;

                var box = new THREE.Box3().setFromObject(object0);
                var size = box.getSize(new THREE.Vector3());
                var maxDim = Math.max(size.x, size.y, size.z);
                var scale = 80 / maxDim;
                object0.scale.set(scale, scale, scale);

                var center = box.getCenter(new THREE.Vector3());
                object0.position.sub(center);
                object0.position.add(new THREE.Vector3(83, -64, -64));

                object0.traverse(child => { if (child.isMesh) child.visible = true; });

                if (str === "a12") {
                    objects = [];
                    object0.traverse(child => { if (child.isMesh) objects.push(child); });
                }

                object0.name = str;
                scene.add(object0);
                fitCameraToObject(camera, controls, object0);
            });
        }

    </script>
</body>
</html>
