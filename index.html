<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜单例题页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      background: #f7f8fc;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* 左侧菜单 */
    .first-menu {
      width: 240px;
      background: #fff;
      border-right: 1px solid #e8e8ef;
      flex-shrink: 0;
      position: relative;
      transition: width 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    /* 折叠后宽度 */
    .first-menu.collapsed {
      width: 70px;
    }

    /* 折叠按钮：固定在菜单顶部，手机电脑都可见 */
    .collapse-btn {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 10px 0;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .collapse-btn:hover {
      background: #4f46e5;
    }

    /* 手机端 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .first-menu {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e8e8ef;
        flex-shrink: 1;
      }
      .first-menu.collapsed {
        width: 100%;
      }
      .menu-items {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px;
      }
      .first-menu.collapsed .menu-items {
        display: none;
      }
      .first-item {
        display: inline-block;
        margin: 0;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 6px;
      }
    }

    .menu-items {
      padding: 12px 0;
      flex: 1;
    }

    .first-item {
      display: block;
      width: calc(100% - 24px);
      margin: 4px 12px;
      padding: 14px 20px;
      font-size: 15px;
      cursor: pointer;
      border-radius: 8px;
      color: #333;
      transition: all 0.25s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    /* 电脑端折叠效果 */
    @media (min-width: 769px) {
      .first-menu.collapsed .first-item:not(.active) {
        height: 0;
        padding: 0;
        margin: 0;
        opacity: 0;
        visibility: hidden;
      }
    }

    .first-item.active {
      background: #6366f1;
      color: #fff;
      font-weight: 500;
    }
    .first-item:hover:not(.active) {
      background: #f1f5ff;
      color: #4f46e5;
    }

    /* 内容区 */
    .content {
      flex: 1;
      padding: 24px 16px;
      width: 100%;
    }
    .content-title {
      font-size: 20px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 20px;
      text-align: center;
    }

    .second-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 500px) {
      .second-grid {
        grid-template-columns: 1fr;
      }
    }

    .second-item {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid #f0f0f0;
    }
    .second-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .second-item span {
      font-size: 15px;
      font-weight: 500;
      color: #222;
      flex: 1;
      line-height: 1.3;
    }

    /* 答案按钮 */
    .answer-btn {
      width: 34px;
      height: 34px;
      background: #00c48c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.2s;
      margin: 0 4px;
    }
    .answer-btn:hover {
      background: #00b47f;
      transform: scale(1.1);
    }

    .play-icon {
      width: 34px;
      height: 34px;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.2s;
    }
    .play-icon:hover {
      background: #dc2626;
      transform: scale(1.1);
    }

    a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    /* 视频弹窗 */
    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .video-modal.show {
      display: flex;
    }
    .video-box {
      width: 100%;
      max-width: 900px;
      position: relative;
    }
    .video-box video {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }
    .video-loading {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .video-loading.show { display: flex; }
    .video-spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: vspin 0.8s linear infinite;
    }
    @keyframes vspin { to { transform: rotate(360deg); } }
    .video-loading-text { color: #fff; font-size: 14px; }
    .close-video {
      position: absolute;
      top: -45px;
      right: 0;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      background: rgba(0,0,0,0.5);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 答案图片弹窗 */
    .answer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .answer-modal.show {
      display: flex;
    }
    .answer-img {
      max-width: 95%;
      max-height: 90vh;
      border-radius: 8px;
      object-fit: contain;
    }
    .close-answer {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      background: rgba(0,0,0,0.5);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="first-menu" id="firstMenu">
      <button class="collapse-btn" id="collapseBtn">
        <span id="btnIcon">☰</span>
        <span id="btnText">折叠菜单</span>
      </button>
      <div class="menu-items" id="menuItems"></div>
    </div>

    <div class="content" id="contentArea"></div>
  </div>

  <!-- 视频弹窗 -->
  <div class="video-modal" id="videoModal">
    <div class="video-box">
      <span class="close-video" onclick="closeVideo()">×</span>
      <div class="video-loading" id="videoLoading">
        <div class="video-spinner"></div>
        <div class="video-loading-text">正在加载视频...</div>
      </div>
      <video id="videoPlayer" controls autoplay></video>
    </div>
  </div>

  <!-- 答案图片弹窗 -->
  <div class="answer-modal" id="answerModal">
    <span class="close-answer" onclick="closeAnswer()">×</span>
    <img class="answer-img" id="answerImg">
  </div>

  <script src="libs/cos-cache.js"></script>
  <script>
    const videoModal = document.getElementById('videoModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const videoLoading = document.getElementById('videoLoading');
    const firstMenu = document.getElementById('firstMenu');
    const collapseBtn = document.getElementById('collapseBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const menuItems = document.getElementById('menuItems');
    const answerModal = document.getElementById('answerModal');
    const answerImg = document.getElementById('answerImg');

    // 判断是否为 COS URL
    function isCOSUrl(url) {
      try {
        const u = new URL(url);
        return u.hostname.includes('.cos.') && u.hostname.includes('.myqcloud.com');
      } catch { return false; }
    }

    // 从 COS URL 获取本地预览 blob URL（使用 IndexedDB 缓存）
    function getKeyFromUrl(url) {
      return new URL(url).pathname.substring(1);
    }

    // 折叠/展开菜单
    collapseBtn.onclick = () => {
      firstMenu.classList.toggle('collapsed');
      const isCollapsed = firstMenu.classList.contains('collapsed');
      btnIcon.textContent = isCollapsed ? '☰' : '✕';
      btnText.textContent = isCollapsed ? '展开菜单' : '折叠菜单';
    };

    function closeVideo() {
      videoPlayer.pause();
      videoPlayer.src = '';
      videoLoading.classList.remove('show');
      videoModal.classList.remove('show');
    }

    videoModal.onclick = (e) => {
      if (e.target === videoModal) closeVideo();
    }

    async function playVideo(videoUrl) {
      if (!videoUrl) return;
      videoModal.classList.add('show');
      videoLoading.classList.add('show');
      try {
        if (isCOSUrl(videoUrl)) {
          videoPlayer.src = await getCOSBlob(videoUrl);
        } else {
          videoPlayer.src = videoUrl;
        }
      } finally {
        videoLoading.classList.remove('show');
      }
    }

    // 打开答案图片（COS 图片通过预览方法获取）
    async function openAnswer(imgUrl) {
      if (!imgUrl) return;
      if (isCOSUrl(imgUrl)) {
        answerImg.src = await getCOSBlob(imgUrl);
      } else {
        answerImg.src = imgUrl;
      }
      answerModal.classList.add('show');
    }
    function closeAnswer() {
      answerModal.classList.remove('show');
    }
    answerModal.onclick = (e) => {
      if (e.target === answerModal) closeAnswer();
    }

    async function loadMenu() {
      const res = await fetch('/api/get-menu?_=' + Date.now());
      const data = await res.json();
      renderFirstMenu(data.firstMenu);
    }

    function renderFirstMenu(list) {
      menuItems.innerHTML = '';

      list.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'first-item' + (index === 0 ? ' active' : '');
        div.innerText = item.name;

        div.onclick = () => {
          document.querySelectorAll('.first-item').forEach(i => i.classList.remove('active'));
          div.classList.add('active');
          renderSecondMenu(item.secondMenu);
        };
        menuItems.appendChild(div);
      });
      renderSecondMenu(list[0].secondMenu);
    }

    function renderSecondMenu(list) {
      const area = document.getElementById('contentArea');
      
      area.innerHTML = `
        <div class="content-title">例题列表</div>
        <div class="second-grid"></div>
      `;

      const grid = area.querySelector('.second-grid');

      list.forEach(item => {
        const a = document.createElement('a');
        a.href = `3d.html?title=${encodeURIComponent(item.title)}&model=${encodeURIComponent(item.model || '')}`;
        a.target = '_blank';

        a.innerHTML = `
          <div class="second-item">
            <img src="" alt="${item.title}">
            <span>${item.title}</span>
            <div class="answer-btn">答</div>
            <div class="play-icon">▶</div>
          </div>
        `;

        const img = a.querySelector('img');
        const answerBtn = a.querySelector('.answer-btn');
        const playBtn = a.querySelector('.play-icon');

        // 教学图：COS 图片通过预览方法获取 blob URL
        if (item.image) {
          if (isCOSUrl(item.image)) {
            getCOSBlob(item.image).then(blobUrl => { img.src = blobUrl; });
          } else {
            img.src = item.image;
          }
        }

        // 答案按钮
        answerBtn.onclick = (e) => {
          e.stopPropagation();
          e.preventDefault();
          openAnswer(item.answer);
        };

        // 视频按钮
        playBtn.onclick = (e) => {
          e.stopPropagation();
          e.preventDefault();
          playVideo(item.video);
        };

        grid.appendChild(a);
      });
    }

    loadMenu();
  </script>
</body>
</html>
