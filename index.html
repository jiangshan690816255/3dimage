<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜单例题页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f7f8fc;
    }

    /* 左侧一级菜单 */
    .first-menu {
      width: 240px;
      background: #ffffff;
      border-right: 1px solid #e8e8ef;
      height: 100vh;
      padding: 24px 0;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.04);
    }

    .first-item {
      padding: 16px 28px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      border-radius: 8px;
      margin: 4px 12px;
      color: #333;
    }

    .first-item.active {
      background: #6366f1;
      color: #fff;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.3);
    }

    .first-item:hover:not(.active) {
      background: #f1f5ff;
      color: #4f46e5;
    }

    /* 右侧内容 */
    .content {
      flex: 1;
      height: 100vh;
      background: #f7f8fc;
      padding: 40px 32px;
      overflow-y: auto;
    }

    .content-title {
      font-size: 24px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 28px;
    }

    .second-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .second-item {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid #f0f0f0;
      position: relative;
    }

    .second-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border-color: #dcdcfc;
    }

    .second-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      margin-right: 16px;
      border: 1px solid #eee;
    }

    .second-item span {
      font-size: 17px;
      font-weight: 500;
      color: #222;
      flex: 1;
      line-height: 1.4;
    }

    /* 视频播放图标 */
    .play-icon {
      width: 36px;
      height: 36px;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-left: 8px;
      transition: 0.2s;
      flex-shrink: 0;
      z-index: 10;
    }
    .play-icon:hover {
      background: #dc2626;
      transform: scale(1.1);
    }

    a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    /* 视频弹窗 */
    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .video-modal.show {
      display: flex;
    }
    .video-box {
      width: 80%;
      max-width: 1000px;
      position: relative;
    }
    .video-box video {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }
    .close-video {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      background: rgba(0,0,0,0.4);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 滚动条美化 */
    .content::-webkit-scrollbar {
      width: 6px;
    }
    .content::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div class="first-menu" id="firstMenu"></div>
  <div class="content" id="contentArea"></div>

  <!-- 视频弹窗 -->
  <div class="video-modal" id="videoModal">
    <div class="video-box">
      <span class="close-video" onclick="closeVideo()">×</span>
      <video id="videoPlayer" controls autoplay></video>
    </div>
  </div>

  <script>
    const videoModal = document.getElementById('videoModal');
    const videoPlayer = document.getElementById('videoPlayer');

    // 关闭视频
    function closeVideo() {
      videoPlayer.pause();
      videoModal.classList.remove('show');
    }

    // 点击遮罩关闭
    videoModal.onclick = (e) => {
      if (e.target === videoModal) closeVideo();
    }

    // 播放视频：读取 models/标题名称.mp4
    function playVideo(title) {
      const videoUrl = `models/${title}.mp4`;
      videoPlayer.src = videoUrl;
      videoModal.classList.add('show');
    }

    // 加载菜单
    async function loadMenu() {
      const res = await fetch('./menu.json?_=' + Date.now());
      const data = await res.json();
      renderFirstMenu(data.firstMenu);
    }

    function renderFirstMenu(list) {
      const dom = document.getElementById('firstMenu');
      dom.innerHTML = '';

      list.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'first-item' + (index === 0 ? ' active' : '');
        div.innerText = item.name;

        div.onclick = () => {
          document.querySelectorAll('.first-item').forEach(i => i.classList.remove('active'));
          div.classList.add('active');
          renderSecondMenu(item.secondMenu);
        };
        dom.appendChild(div);
      });
      renderSecondMenu(list[0].secondMenu);
    }

    function renderSecondMenu(list) {
      const area = document.getElementById('contentArea');
      
      area.innerHTML = `
        <div class="content-title">例题列表</div>
        <div class="second-grid"></div>
      `;

      const grid = area.querySelector('.second-grid');

      list.forEach(item => {
        const a = document.createElement('a');
        a.href = `3d.html?title=${encodeURIComponent(item.title)}`;
        a.target = '_blank';

        a.innerHTML = `
          <div class="second-item">
            <img src="${item.image}" alt="${item.title}">
            <span>${item.title}</span>
            <div class="play-icon" onclick="event.stopPropagation();event.preventDefault();playVideo('${item.title}')">▶</div>
          </div>
        `;
        grid.appendChild(a);
      });
    }

    loadMenu();
  </script>
</body>
</html>
