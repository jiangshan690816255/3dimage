<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>菜单管理（上传到腾讯云 COS）</title>
    <link rel="stylesheet" href="mycss/manage.css">
</head>
<body>
    <h1>菜单管理（上传到腾讯云 COS）</h1>
    <div class="box">
        <button id="addUnitBtn">新增一级菜单</button>
        <button id="copyBtn">复制JSON</button>
        <button id="save">保存并上传到腾讯云</button>
        <div id="tip"></div>
    </div>
    <div id="editor"></div>

    <div class="img-modal" id="imgModal">
        <span class="close-modal" onclick="closeImgModal()">×</span>
        <img class="modal-img" id="modalImg" src="">
    </div>

    <div class="video-modal" id="videoModal">
        <span class="close-modal" onclick="closeVideoModal()">×</span>
        <video class="modal-video" id="modalVideo" controls autoplay></video>
    </div>

    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-spinner"></div>
        <div class="upload-text" id="uploadText">正在上传到腾讯云...</div>
    </div>

    <script src="libs/cos-cache.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="libs/manage.js"></script>
</body>
</html>
