<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>菜单管理（上传到腾讯云 COS）</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:微软雅黑}
        body{padding:20px;background:#f5f5f5}
        .box{background:white;padding:20px;margin-bottom:15px;border-radius:8px;box-shadow:0 0 5px #00000010}
        h1{margin-bottom:20px;color:#333}
        h3{margin-bottom:10px;color:#333}
        input{padding:8px;margin:0;border:1px solid #ddd;border-radius:4px}
        button{background:#409eff;color:white;padding:8px 12px;border:none;border-radius:4px;cursor:pointer}
        .unit{
            border-left:4px solid #409eff;
            padding-left:15px;
            margin:15px 0;
            background:#fff;
            border-radius:6px;
            overflow:hidden;
        }
        .unit-header {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:10px 0;
        }
        .header-left {
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
            flex:1;
        }
        .unit-content {
            display:none;
            padding:10px 0;
            padding-left:10px;
        }
        .item{
            background:#f9f9f9;
            padding:10px;
            margin:6px 0;
            border-radius:4px;
            display:flex;
            align-items:center;
            gap:12px;
        }
        .item-left{
            display:flex;
            flex-direction:column;
            gap:6px;
            width:50%;
        }
        .item-row{
            display:flex;
            align-items:center;
            gap:6px;
            width:100%;
        }
        .item-row label{
            white-space:nowrap;
            font-size:14px;
            color:#333;
            width:50px;
        }
        .item-row input{
            flex:1;
        }

        .img-box{
            display:flex;
            align-items:center;
            justify-content:flex-start;
            gap:8px;
            width:50%;
        }

        .img-wrap{
            position:relative;
            flex-shrink:0;
        }
        img.prev{
            height:74px;
            aspect-ratio:1/1;
            object-fit:cover;
            border:1px solid #ddd;
            border-radius:4px;
            cursor:pointer;
            display:block;
        }
        .img-tag{
            position:absolute;
            top:-4px;
            right:-4px;
            background:#1677ff;
            color:#fff;
            font-size:12px;
            padding:2px 4px;
            border-radius:4px;
            font-weight:bold;
            white-space:nowrap;
        }

        .answer-wrap{
            position:relative;
            flex-shrink:0;
        }
        img.answer-prev{
            height:74px;
            aspect-ratio:1/1;
            object-fit:cover;
            border:1px solid #ddd;
            border-radius:4px;
            cursor:pointer;
            display:block;
        }
        /* 无图片时不显示预览和标签（避免空白边框/裂图占位） */
        img.prev[src=""], img.answer-prev[src=""] {
            display: none;
        }
        .img-wrap:has(img[src=""]) .img-tag {
            display: none;
        }
        .answer-tag{
            position:absolute;
            top:-4px;
            right:-4px;
            background:#00c48c;
            color:#fff;
            font-size:12px;
            padding:2px 4px;
            border-radius:4px;
            font-weight:bold;
            white-space:nowrap;
            display:none;
        }
        .answer-tag.show{
            display:inline-block;
        }

        .video-wrap, .model-wrap {
            position: relative;
            flex-shrink: 0;
            display: none;
        }
        .video-wrap.show, .model-wrap.show {
            display: block;
        }
        .video-icon, .model-icon {
            height: 74px;
            aspect-ratio: 1/1;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: #fafafa;
            color: #999;
        }
        .video-wrap .img-tag { background: #1677ff; position: absolute; top: -4px; right: -4px; }
        .model-wrap .img-tag { background: #ef4444; position: absolute; top: -4px; right: -4px; }

        /* 二维码容器 */
        .qr-wrap {
            flex-shrink: 0;
            width: 74px;
            height: 74px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            display: none;
            position: relative;
        }
        .qr-wrap.show { display: flex; align-items: center; justify-content: center; }
        .qr-img { width: 66px; height: 66px; }

        .item button{
            background:#f56c6c!important;
            padding:12px 20px!important;
            font-size:16px!important;
            border:none!important;
            color:#fff!important;
            border-radius:4px!important;
            cursor:pointer!important;
            flex-shrink:0;
        }

        .add-item-btn{
            background:#409eff;
            color:white;
            padding:10px 16px;
            font-size:14px;
            border:none;
            border-radius:4px;
            cursor:pointer;
            margin-top:8px;
        }

        #save{background:#00c48c}
        #copyBtn{background:#1677ff}
        #addUnitBtn{background:#67c23a}
        #delUnit{background:#f56c6c;padding:6px 10px;font-size:12px}
        #tip{color:#00c48c;margin-top:10px}

        .img-modal, .video-modal{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:999;
        }
        .img-modal.show, .video-modal.show{display:flex;}
        .modal-img, .modal-video{max-width:90%;max-height:90%;object-fit:contain;}
        .close-modal{position:absolute;top:20px;right:30px;color:#fff;font-size:30px;cursor:pointer;}
        .video-icon{cursor:pointer;user-select:none;}
        .upload-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
            flex-direction: column; gap: 12px;
        }
        .upload-overlay.show { display: flex; }
        .upload-spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .upload-text { color: #fff; font-size: 16px; }
    </style>
</head>
<body>
    <h1>菜单管理（上传到腾讯云 COS）</h1>
    <div class="box">
        <button id="addUnitBtn">新增一级菜单</button>
        <button id="copyBtn">复制JSON</button>
        <button id="save">保存并上传到腾讯云</button>
        <div id="tip"></div>
    </div>
    <div id="editor"></div>

    <div class="img-modal" id="imgModal">
        <span class="close-modal" onclick="closeImgModal()">×</span>
        <img class="modal-img" id="modalImg" src="">
    </div>

    <div class="video-modal" id="videoModal">
        <span class="close-modal" onclick="closeVideoModal()">×</span>
        <video class="modal-video" id="modalVideo" controls autoplay></video>
    </div>

    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-spinner"></div>
        <div class="upload-text" id="uploadText">正在上传到腾讯云...</div>
    </div>

    <script src="libs/cos-cache.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        let menuData;
        const imgModal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        const videoModal = document.getElementById('videoModal');
        const modalVideo = document.getElementById('modalVideo');
        let fileBuffer = {};
        let answerPreview = {};
        let cosUrls = {}; // 存储 COS 上传后的 URL，key -> { image?, model?, video?, answer? }
        let uploading = false;
        let isDirty = false; // 跟踪是否有未保存的修改
        let nextItemId = 1; // 例题唯一序号，自增

        // 生成二维码 base64（离屏 div → 取子 canvas → toDataURL）
        function generateQRBase64(url) {
            const container = document.createElement('div');
            container.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
            document.body.appendChild(container);
            new QRCode(container, { text: url, width: 66, height: 66, colorDark: '#000', colorLight: '#fff' });
            const qrCanvas = container.querySelector('canvas');
            const data = qrCanvas ? qrCanvas.toDataURL('image/png') : '';
            document.body.removeChild(container);
            return data;
        }

        // 离开页面时提醒
        window.addEventListener('beforeunload', function (e) {
            if (isDirty || Object.keys(cosUrls).length > 0) {
                e.preventDefault();
                e.returnValue = '你有未保存的修改，确定要离开吗？';
                return e.returnValue;
            }
        });

        // 监听编辑区域文本修改（通过事件委托）
        document.getElementById('editor').addEventListener('input', function (e) {
            if (e.target.closest('.uname') || e.target.closest('.title')) {
                isDirty = true;
            }
        });

        // 锁定/解锁界面，显示上传 loading
        function setUploading(state, text) {
            uploading = state;
            const overlay = document.getElementById('uploadOverlay');
            const uploadText = document.getElementById('uploadText');
            if (state) {
                overlay.classList.add('show');
                uploadText.textContent = text || '正在上传到腾讯云...';
            } else {
                overlay.classList.remove('show');
            }
            // 禁用所有按钮和输入框
            document.querySelectorAll('button, input, textarea').forEach(el => {
                if (state) {
                    el.setAttribute('data-upload-disabled', el.disabled ? '1' : '0');
                    el.disabled = true;
                } else {
                    if (el.getAttribute('data-upload-disabled') === '0') el.disabled = false;
                    el.removeAttribute('data-upload-disabled');
                }
            });
        }

        // 上传文件到 COS
        async function uploadFileToCOS(file, category, itemKey) {
            const fd = new FormData();
            const ext = file.name.split('.').pop();
            const safeName = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
            fd.append('file', file);
            fd.append('key', 'uploads/' + safeName);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    if (!cosUrls[itemKey]) cosUrls[itemKey] = {};
                    cosUrls[itemKey][category] = data.url;
                    console.log(`✅ ${category} 上传成功:`, data.url);
                    return data;
                }
            } catch (e) {
                console.error('上传失败:', e);
            }
            return null;
        }

        // 删除 COS 上的旧文件（先删后传）
        async function deleteFileFromCOS(cosUrl) {
            if (!cosUrl) {
                console.log('⏭ 跳过删除（空 URL）');
                return false;
            }
            if (!isCOSUrl(cosUrl)) {
                console.log('⏭ 跳过删除（非 COS URL）:', cosUrl);
                return false;
            }
            const key = getKeyFromUrl(cosUrl);
            console.log(`🗑 正在删除: ${key}`);
            try {
                const res = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const data = await res.json();
                console.log('删除响应:', data);
                if (data.success) {
                    console.log(`✅ 已删除: ${key}`);
                    return true;
                } else {
                    console.warn(`⚠ 删除失败: ${data.message}`);
                    return false;
                }
            } catch (e) {
                console.warn('删除请求异常:', e);
                return false;
            }
        }

        // 从 COS URL 提取文件路径（去掉域名）
        function getKeyFromUrl(url) {
            return new URL(url).pathname.substring(1);
        }

        // 判断是否为 COS URL
        function isCOSUrl(url) {
            try {
                const u = new URL(url);
                return u.hostname.includes('.cos.') && u.hostname.includes('.myqcloud.com');
            } catch { return false; }
        }

        // 通过 COS URL 获取本地预览 blob URL（使用 IndexedDB 缓存）
        // getCOSBlob 由 libs/cos-cache.js 提供，含 IndexedDB 缓存

        function closeImgModal() {
            imgModal.classList.remove('show');
        }

        function closeVideoModal() {
            videoModal.classList.remove('show');
            modalVideo.pause();
            modalVideo.src = '';
        }

        imgModal.onclick = function(e) {
            if (e.target === imgModal) {
                closeImgModal();
            }
        };

        videoModal.onclick = function(e) {
            if (e.target === videoModal) {
                closeVideoModal();
            }
        };

        fetch('/api/get-menu?_=' + Date.now())
            .then(res => res.json())
            .then(data => {
                menuData = data;
                // 计算已有例题的最大ID，初始化 nextItemId
                let maxId = 0;
                menuData.firstMenu.forEach(unit => {
                    unit.secondMenu.forEach(item => {
                        if (item.id && typeof item.id === 'number' && item.id > maxId) maxId = item.id;
                    });
                });
                // 自动为历史例题补全 ID 和生成二维码
                menuData.firstMenu.forEach(unit => {
                    unit.secondMenu.forEach(item => {
                        if (!item.id) item.id = ++maxId;
                        if (item.id && !item.qrcode) {
                            const qrUrl = `${location.origin}/3d.html?id=${item.id}`;
                            item.qrcode = generateQRBase64(qrUrl);
                        }
                    });
                });
                nextItemId = maxId + 1;
                render();
                isDirty = false;
            })
            .catch(() => {
                menuData = {
                    "firstMenu": [{
                        "id": "unit1",
                        "name": "新单元",
                        "secondMenu": [{
                            "title": "新例题",
                            "image": "",
                            "model": "",
                            "video": "",
                            "answer": ""
                        }]
                    }]
                };
                render();
                isDirty = false;
            });

        function render() {
            const dom = document.getElementById('editor');
            dom.innerHTML = '';

            menuData.firstMenu.forEach((unit, uidx) => {
                const u = document.createElement('div');
                u.className = 'unit';
                u.innerHTML = `
                    <div class="unit-header">
                        <div class="header-left" onclick="toggleUnit(${uidx})">
                            <span class="fold-icon" id="icon-${uidx}">▶</span>
                            <h3>一级菜单：<input class="uname" value="${unit.name}" onclick="event.stopPropagation()"></h3>
                        </div>
                        <div class="header-btn-group">
                            <button id="delUnit" onclick="delUnit(${uidx},event)">删除单元</button>
                        </div>
                    </div>
                    <div class="unit-content" id="content-${uidx}">
                        <div class="items"></div>
                        <button class="add-item-btn" onclick="addItem(${uidx})">添加例题</button>
                    </div>
                `;
                dom.appendChild(u);

                const items = u.querySelector('.items');
                unit.secondMenu.forEach((item, idx) => {
                    const key = `${uidx}-${idx}`;
                    const ansSrc = answerPreview[key] || item.answer;
                    const i = document.createElement('div');
                    i.className = 'item';
                    i.innerHTML = `
                        <div class="item-left">
                            <div class="item-row"><label>标题：</label><input class="title" value="${item.title}"></div>
                            <div class="item-row"><label>图片：</label><input type="file" class="imgFile"></div>
                            <div class="item-row"><label>答案：</label><input type="file" class="answerFile"></div>
                            <div class="item-row"><label>视频：</label><input type="file" class="videoFile" accept="video/*"></div>
                            <div class="item-row"><label>模型：</label><input type="file" class="modelFile" accept=".fbx"></div>
                        </div>
                        <div class="img-box">
                            <div class="img-wrap">
                                <img class="prev" src="${item.image}">
                                <div class="img-tag">教学图</div>
                            </div>
                            <div class="answer-wrap">
                                <img class="answer-prev" src="${ansSrc}">
                                <div class="answer-tag ${item.answer ? 'show' : ''}">答案</div>
                            </div>
                            <div class="video-wrap ${item.video ? 'show' : ''}">
                                <div class="video-icon">▶</div>
                                <div class="img-tag">视频</div>
                            </div>
                            <div class="model-wrap ${item.model ? 'show' : ''}">
                                <div class="model-icon">3D</div>
                                <div class="img-tag">模型</div>
                            </div>
                            <div class="qr-wrap ${item.qrcode ? 'show' : ''}">
                                <img class="qr-img" src="${item.qrcode || ''}">
                            </div>
                        </div>
                        <button onclick="delItem(${uidx},${idx}, this)">删</button>
                    `;
                    items.appendChild(i);

                    const prev = i.querySelector('.prev');
                    const answerPrev = i.querySelector('.answer-prev');
                    const imgFile = i.querySelector('.imgFile');
                    const answerFile = i.querySelector('.answerFile');
                    const modelFile = i.querySelector('.modelFile');
                    const videoFile = i.querySelector('.videoFile');
                    const fbxWrap = i.querySelector('.model-wrap');
                    const videoWrap = i.querySelector('.video-wrap');
                    const answerTag = i.querySelector('.answer-tag');

                    prev.onclick = function () {
                        if (prev.src) {
                            modalImg.src = prev.src;
                            imgModal.classList.add('show');
                        }
                    };
                    answerPrev.onclick = function () {
                        if (answerPrev.src) {
                            modalImg.src = answerPrev.src;
                            imgModal.classList.add('show');
                        }
                    };

                    const videoIcon = i.querySelector('.video-icon');
                    if (videoIcon) {
                        videoIcon.onclick = async function () {
                            const videoUrl = (cosUrls[key] && cosUrls[key].video) || item.video;
                            if (!videoUrl) return;
                            setUploading(true, '正在加载视频...');
                            try {
                                const blobUrl = await getCOSBlob(videoUrl);
                                modalVideo.src = blobUrl;
                                videoModal.classList.add('show');
                            } catch(e) {
                                alert('视频加载失败: ' + (e.message || e));
                            } finally {
                                setUploading(false);
                            }
                        };
                    }

                    imgFile.onchange = async function () {
                        const f = imgFile.files[0];
                        if (!f) return;
                        setUploading(true, '正在上传图片...');
                        try {
                            await deleteFileFromCOS(cosUrls[key] && cosUrls[key].image);
                            const result = await uploadFileToCOS(f, 'image', key);
                            if (result && result.success && result.url) {
                                prev.src = await getCOSBlob(result.url);
                                isDirty = true;
                                console.log('✅ 图片上传完成，预览已更新');
                            } else {
                                alert('图片上传失败，请重试');
                                imgFile.value = '';
                            }
                        } finally {
                            setUploading(false);
                        }
                    };

                    answerFile.onchange = async function () {
                        const f = answerFile.files[0];
                        if (!f) return;
                        setUploading(true, '正在上传答案图...');
                        try {
                            await deleteFileFromCOS(cosUrls[key] && cosUrls[key].answer);
                            fileBuffer[key + "_answer"] = f;
                            const result = await uploadFileToCOS(f, 'answer', key);
                            if (result && result.success && result.url) {
                                answerPrev.src = await getCOSBlob(result.url);
                                answerTag.classList.add('show');
                                isDirty = true;
                                console.log('✅ 答案图上传完成');
                            } else {
                                alert('答案图上传失败，请重试');
                                answerFile.value = '';
                                fileBuffer[key + "_answer"] = undefined;
                            }
                        } finally {
                            setUploading(false);
                        }
                    };

                    videoFile.onchange = async function () {
                        const f = videoFile.files[0];
                        if (!f) return;
                        setUploading(true, '正在上传视频...');
                        try {
                            await deleteFileFromCOS(cosUrls[key] && cosUrls[key].video);
                            const result = await uploadFileToCOS(f, 'video', key);
                            if (result && result.success && result.url) {
                                fileBuffer[key + "_video"] = f;
                                videoWrap.classList.add('show');
                                isDirty = true;
                                console.log('✅ 视频上传完成');
                            } else {
                                alert('视频上传失败，请重试');
                                videoFile.value = '';
                            }
                        } finally {
                            setUploading(false);
                        }
                    };

                    modelFile.onchange = async function () {
                        const f = modelFile.files[0];
                        if (!f) return;
                        setUploading(true, '正在上传3D模型...');
                        try {
                            await deleteFileFromCOS(cosUrls[key] && cosUrls[key].model);
                            const result = await uploadFileToCOS(f, 'model', key);
                            if (result && result.success && result.url) {
                                fileBuffer[key] = f;
                                fbxWrap.classList.add('show');
                                isDirty = true;
                                console.log('✅ 模型上传完成');
                            } else {
                                alert('模型上传失败，请重试');
                                modelFile.value = '';
                            }
                        } finally {
                            setUploading(false);
                        }
                    };

                    // 初始加载时，教学图和答案通过预览方法获取 blob URL
                    if (item.image && isCOSUrl(item.image)) {
                        getCOSBlob(item.image).then(blobUrl => { prev.src = blobUrl; });
                    }
                    if (item.answer && isCOSUrl(item.answer)) {
                        getCOSBlob(item.answer).then(blobUrl => { answerPrev.src = blobUrl; });
                    }
                });
            });
        }

        window.toggleUnit = function (uidx) {
            const c = document.getElementById(`content-${uidx}`);
            const icon = document.getElementById(`icon-${uidx}`);
            if (c.style.display === 'block') {
                c.style.display = 'none';
                icon.textContent = '▶';
            } else {
                c.style.display = 'block';
                icon.textContent = '▼';
            }
        };

        document.getElementById('addUnitBtn').onclick = function () {
            const itemId = nextItemId++;
            menuData.firstMenu.push({
                id: 'unit' + Date.now(),
                name: "新单元",
                secondMenu: [{
                    id: itemId,
                    title: "新例题",
                    image: "",
                    model: "",
                    video: "",
                    answer: "",
                    qrcode: generateQRBase64(`${location.origin}/3d.html?id=${itemId}`)
                }]
            });
            render();
            isDirty = true;
        };

        window.delUnit = async function (uidx, e) {
            e.stopPropagation();
            if (menuData.firstMenu.length <= 1) {
                alert('至少保留一个');
                return;
            }
            if (!confirm('确定删除？此操作将同时删除单元下所有云端文件')) return;
            setUploading(true, '正在删除单元下所有文件...');
            try {
                const unit = menuData.firstMenu[uidx];
                const deletions = [];
                unit.secondMenu.forEach((item, idx) => {
                    const key = `${uidx}-${idx}`;
                    const itemData = item || {};
                    const urls = {
                        image: (cosUrls[key] && cosUrls[key].image) || (isCOSUrl(itemData.image) ? itemData.image : null),
                        answer: (cosUrls[key] && cosUrls[key].answer) || (isCOSUrl(itemData.answer) ? itemData.answer : null),
                        video: (cosUrls[key] && cosUrls[key].video) || (isCOSUrl(itemData.video) ? itemData.video : null),
                        model: (cosUrls[key] && cosUrls[key].model) || (isCOSUrl(itemData.model) ? itemData.model : null),
                    };
                    for (const cat of ['image', 'answer', 'video', 'model']) {
                        if (urls[cat]) deletions.push(deleteFileFromCOS(urls[cat]));
                    }
                    delete cosUrls[key];
                    delete fileBuffer[key];
                    delete fileBuffer[key + '_video'];
                    delete fileBuffer[key + '_answer'];
                    delete answerPreview[key];
                });
                await Promise.all(deletions);
                menuData.firstMenu.splice(uidx, 1);
                render();
                isDirty = true;
            } finally {
                setUploading(false);
            }
        };

        window.addItem = function (uidx) {
            const itemId = nextItemId++;
            menuData.firstMenu[uidx].secondMenu.push({
                id: itemId,
                title: "新例题",
                image: "",
                model: "",
                video: "",
                answer: "",
                qrcode: generateQRBase64(`${location.origin}/3d.html?id=${itemId}`)
            });
            render();
            isDirty = true;
            const content = document.getElementById(`content-${uidx}`);
            const icon = document.getElementById(`icon-${uidx}`);
            content.style.display = 'block';
            icon.textContent = '▼';
        };

        window.delItem = async function (uidx, idx, btnEl) {
            if (!confirm('确定删除？此操作将同时删除该例题的云端文件')) return;
            setUploading(true, '正在删除例题文件...');
            try {
                const key = `${uidx}-${idx}`;
                const itemData = menuData.firstMenu[uidx].secondMenu[idx] || {};
                const urls = {
                    image: (cosUrls[key] && cosUrls[key].image) || (isCOSUrl(itemData.image) ? itemData.image : null),
                    answer: (cosUrls[key] && cosUrls[key].answer) || (isCOSUrl(itemData.answer) ? itemData.answer : null),
                    video: (cosUrls[key] && cosUrls[key].video) || (isCOSUrl(itemData.video) ? itemData.video : null),
                    model: (cosUrls[key] && cosUrls[key].model) || (isCOSUrl(itemData.model) ? itemData.model : null),
                };
                const deletions = [];
                for (const cat of ['image', 'answer', 'video', 'model']) {
                    if (urls[cat]) deletions.push(deleteFileFromCOS(urls[cat]));
                }
                await Promise.all(deletions);
                delete cosUrls[key];
                delete fileBuffer[key];
                delete fileBuffer[key + "_video"];
                delete fileBuffer[key + "_answer"];
                delete answerPreview[key];
                menuData.firstMenu[uidx].secondMenu.splice(idx, 1);
                const itemEl = btnEl.closest('.item');
                if (itemEl) itemEl.remove();
                isDirty = true;
            } finally {
                setUploading(false);
            }
        };

        function getJson() {
            document.querySelectorAll('.unit').forEach((u, uidx) => {
                menuData.firstMenu[uidx].name = u.querySelector('.uname').value;
                const arr = [];
                u.querySelectorAll('.item').forEach((it, idx) => {
                    const t = it.querySelector('.title').value.trim();
                    const key = `${uidx}-${idx}`;
                    const oldData = menuData.firstMenu[uidx].secondMenu[idx] || {};

                    const newModel = (cosUrls[key] && cosUrls[key].model)
                        ? getKeyFromUrl(cosUrls[key].model) : (oldData.model || "");

                    const itemData = {
                        id: oldData.id || 0,
                        title: t,
                        image: (cosUrls[key] && cosUrls[key].image)
                            ? getKeyFromUrl(cosUrls[key].image) : (oldData.image || ""),
                        model: newModel,
                        video: (cosUrls[key] && cosUrls[key].video)
                            ? getKeyFromUrl(cosUrls[key].video) : (oldData.video || ""),
                        answer: (cosUrls[key] && cosUrls[key].answer)
                            ? getKeyFromUrl(cosUrls[key].answer) : (oldData.answer || ""),
                        qrcode: oldData.qrcode || ""
                    };

                    arr.push(itemData);
                });
                menuData.firstMenu[uidx].secondMenu = arr;
            });

                // 补全缺失的 id（已有数据可能没有 id 字段）
            let maxId = 0;
            menuData.firstMenu.forEach(unit => {
                unit.secondMenu.forEach(item => {
                    if (item.id && item.id > maxId) maxId = item.id;
                });
            });
            menuData.firstMenu.forEach(unit => {
                unit.secondMenu.forEach(item => {
                    if (!item.id) item.id = ++maxId;
                    // 有 id 但缺少二维码时补充生成（兼容旧数据）
                    if (item.id && !item.qrcode) {
                        item.qrcode = generateQRBase64(`${location.origin}/3d.html?id=${item.id}`);
                    }
                });
            });
            nextItemId = maxId + 1;

            return JSON.stringify(menuData, null, 2);
        }

        document.getElementById('copyBtn').onclick = function () {
            navigator.clipboard.writeText(getJson());
            document.getElementById('tip').innerText = "✅ 已复制JSON";
        };

        document.getElementById('save').onclick = async function () {
            const tip = document.getElementById('tip');
            tip.innerText = "⏳ 正在上传 menu.json 到腾讯云...";

            const jsonContent = getJson();
            try {
                const res = await fetch('/api/save-menu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: jsonContent
                });
                const data = await res.json();
                if (data.success) {
                    tip.innerText = "✅ 上传完成！";
                    isDirty = false;
                    cosUrls = {};
                    fileBuffer = {};
                } else {
                    tip.innerText = "❌ 上传失败：" + data.message;
                }
            } catch (e) {
                tip.innerText = "❌ 上传失败：" + e.message;
            }
        };
    </script>
</body>
</html>
